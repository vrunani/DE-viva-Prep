<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panda Data Engineering Study Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --green-dark:#2d5a27;--green-mid:#4a7c59;--green-light:#7ab648;
  --green-pale:#c8e6c9;--card-bg:rgba(240,247,238,0.93);
}
body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;background:#2d5a27;}
.bg{position:fixed;inset:0;background:
  radial-gradient(ellipse at 20% 50%, #1a4a2e 0%, transparent 60%),
  radial-gradient(ellipse at 80% 20%, #0d3320 0%, transparent 55%),
  radial-gradient(ellipse at 60% 80%, #2d6b3a 0%, transparent 50%),
  linear-gradient(160deg, #0a2e18 0%, #1c5c30 35%, #0f3d22 65%, #081f12 100%);
z-index:0;}
.overlay{position:fixed;inset:0;z-index:1;pointer-events:none;}

/* animated bamboo stalks */
.bamboo-bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.bamboo-bg canvas{width:100%;height:100%;}
.wrap{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:16px 16px 60px;}

/* HEADER */
header{text-align:center;padding:36px 10px 18px;}
header h1{font-family:'Fredoka One',cursive;font-size:clamp(1.8rem,5vw,3.2rem);color:#fff;text-shadow:2px 4px 10px rgba(0,0,0,0.6);letter-spacing:1px;}
header p{color:var(--green-pale);font-size:1rem;margin-top:6px;font-weight:600;}
.bounce{display:inline-block;animation:bop 2s ease-in-out infinite;}
@keyframes bop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* TABS */
.tabs{display:flex;gap:10px;justify-content:center;margin:20px 0 14px;flex-wrap:wrap;}
.tab-btn{
  font-family:'Fredoka One',cursive;font-size:1rem;padding:10px 26px;
  border:2px solid rgba(255,255,255,0.45);border-radius:50px;
  background:rgba(255,255,255,0.14);color:#fff;cursor:pointer;
  transition:all 0.22s;backdrop-filter:blur(8px);letter-spacing:0.4px;
}
.tab-btn:hover{background:rgba(255,255,255,0.28);transform:translateY(-2px);}
.tab-btn.active{background:var(--green-light);border-color:var(--green-light);color:#111;box-shadow:0 4px 18px rgba(122,182,72,0.45);transform:translateY(-2px);}

/* PANELS */
.panel{display:none;}
.panel.show{display:block;}

/* ===== Q&A ===== */
.topic{margin-bottom:18px;}
.topic-hd{
  font-family:'Fredoka One',cursive;font-size:1.15rem;color:#fff;
  background:linear-gradient(135deg,var(--green-dark),var(--green-mid));
  border-radius:12px 12px 0 0;padding:12px 18px;
  display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
  position:relative;
}
.topic-hd .arrow{position:absolute;right:16px;font-size:0.9rem;transition:transform 0.28s;}
.topic.closed .topic-hd .arrow{transform:rotate(-90deg);}
.topic-body{overflow:hidden;}
.topic.closed .topic-body{display:none;}

.qa{background:var(--card-bg);border-left:4px solid var(--green-light);border-bottom:1px solid rgba(74,124,89,0.25);border-right:1px solid rgba(74,124,89,0.18);backdrop-filter:blur(8px);}
.qa:last-child{border-radius:0 0 12px 12px;}
.qa-q{
  padding:13px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;
  font-weight:700;color:var(--green-dark);font-size:0.93rem;transition:background 0.18s;user-select:none;
}
.qa-q:hover{background:rgba(122,182,72,0.1);}
.qa-q .num{font-family:'Fredoka One',cursive;color:var(--green-mid);min-width:24px;}
.qa-q .arr{color:var(--green-light);font-size:1rem;transition:transform 0.28s;flex-shrink:0;margin-left:auto;}
.qa.open .qa-q .arr{transform:rotate(180deg);}
.qa-ans{max-height:0;overflow:hidden;transition:max-height 0.38s ease;background:rgba(255,255,255,0.72);}
.qa.open .qa-ans{max-height:500px;}
.qa-ans-in{padding:13px 16px 15px 42px;color:#111;font-size:0.9rem;line-height:1.75;border-top:1px dashed var(--green-pale);}
.qa-ans-in strong{color:var(--green-dark);}

/* ===== FLASHCARDS ===== */
.fc-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 20px;touch-action:pan-y;}
.fc-meta{display:flex;gap:10px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.fc-pill{
  font-family:'Fredoka One',cursive;font-size:0.88rem;padding:6px 16px;
  background:rgba(255,255,255,0.16);border:1.5px solid rgba(255,255,255,0.32);
  border-radius:30px;color:#fff;backdrop-filter:blur(6px);
}

/* Card container — NO perspective here to avoid iframe issues */
.fc-stage{
  width:100%;max-width:600px;height:320px;position:relative;
  cursor:pointer;
}

/* Inner card that flips */
.fc-inner{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  transition:transform 0.55s cubic-bezier(0.4,0,0.2,1);
  perspective:1200px;
}
.fc-inner.flipped{transform:rotateY(180deg);}

.fc-face{
  position:absolute;inset:0;border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 24px;text-align:center;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
}
.fc-front{
  background:var(--card-bg);border:3px solid var(--green-light);
  box-shadow:0 8px 32px rgba(0,0,0,0.22);backdrop-filter:blur(12px);
}
.fc-back{
  background:rgba(35,78,32,0.94);border:3px solid var(--green-pale);
  box-shadow:0 8px 32px rgba(0,0,0,0.3);backdrop-filter:blur(12px);
  transform:rotateY(180deg);
}
.fc-label{
  font-family:'Fredoka One',cursive;font-size:0.8rem;letter-spacing:2px;
  padding:3px 14px;border-radius:20px;margin-bottom:14px;
}
.fc-front .fc-label{background:var(--green-pale);color:var(--green-dark);}
.fc-back .fc-label{background:var(--green-light);color:#111;}
.fc-front .fc-text{font-size:clamp(0.95rem,2.4vw,1.25rem);font-weight:800;color:var(--green-dark);line-height:1.5;}
.fc-back .fc-text{font-size:clamp(0.82rem,1.9vw,1rem);color:#fff;line-height:1.7;font-weight:600;}
.fc-tip{font-size:0.75rem;margin-top:14px;opacity:0.55;font-weight:600;}
.fc-front .fc-tip{color:var(--green-mid);}
.fc-back .fc-tip{color:var(--green-pale);}

/* slide animation */
@keyframes slideOut{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(-90px)}}
@keyframes slideOutR{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(90px)}}
@keyframes slideIn{0%{opacity:0;transform:translateX(90px)}100%{opacity:1;transform:translateX(0)}}
@keyframes slideInR{0%{opacity:0;transform:translateX(-90px)}100%{opacity:1;transform:translateX(0)}}
.fc-stage.anim-next .fc-inner{animation:slideOut 0.18s forwards;}
.fc-stage.anim-prev .fc-inner{animation:slideOutR 0.18s forwards;}
.fc-stage.anim-in-next .fc-inner{animation:slideIn 0.22s forwards;}
.fc-stage.anim-in-prev .fc-inner{animation:slideInR 0.22s forwards;}

.fc-prog-wrap{width:100%;max-width:600px;height:6px;background:rgba(255,255,255,0.22);border-radius:10px;margin-top:16px;overflow:hidden;}
.fc-prog{height:100%;background:var(--green-light);border-radius:10px;transition:width 0.35s;}

.fc-nav{display:flex;gap:12px;margin-top:20px;align-items:center;flex-wrap:wrap;justify-content:center;}
.fc-btn{
  font-family:'Fredoka One',cursive;font-size:1rem;padding:10px 26px;
  border-radius:50px;border:2px solid rgba(255,255,255,0.42);
  background:rgba(255,255,255,0.15);color:#fff;cursor:pointer;
  transition:all 0.2s;backdrop-filter:blur(8px);letter-spacing:0.4px;
  display:flex;align-items:center;gap:6px;
}
.fc-btn:hover{background:rgba(255,255,255,0.28);transform:translateY(-2px);}
.fc-btn:active{transform:scale(0.95);}
.fc-btn.primary{background:var(--green-light);border-color:var(--green-light);color:#111;box-shadow:0 4px 16px rgba(122,182,72,0.4);}
.fc-btn.primary:hover{background:#8bcc55;}
.fc-extras{margin-top:12px;}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="bamboo-canvas" style="position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%;"></canvas>

<div class="wrap">
  <header>
    <span class="bounce">🐼</span>
    <h1>Data Engineering Study Hub</h1>
    <p>85 questions across 14 topics &mdash; bamboo-powered knowledge 🎋</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tab-qa" onclick="switchTab('qa')">📖 Q&amp;A Explorer</button>
    <button class="tab-btn" id="tab-fc" onclick="switchTab('fc')">🎴 Flashcards</button>
  </div>

  <div id="panel-qa" class="panel show"></div>

  <div id="panel-fc" class="panel">
    <div class="fc-wrap">
      <div class="fc-meta">
        <div class="fc-pill" id="fc-counter">Card 1 of 85</div>
        <div class="fc-pill" id="fc-topic">Topic: —</div>
      </div>

      <div class="fc-stage" id="fc-stage">
        <div class="fc-inner" id="fc-inner">
          <div class="fc-face fc-front">
            <div class="fc-label">🐼 QUESTION</div>
            <div class="fc-text" id="fc-q">Loading...</div>
            <div class="fc-tip">Tap card to reveal answer</div>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-label">🎋 ANSWER</div>
            <div class="fc-text" id="fc-a">...</div>
            <div class="fc-tip">Swipe or use buttons to navigate</div>
          </div>
        </div>
      </div>

      <div class="fc-prog-wrap"><div class="fc-prog" id="fc-prog"></div></div>

      <div class="fc-nav">
        <button class="fc-btn" onclick="fcNav(-1)">&#8592; Prev</button>
        <button class="fc-btn primary" onclick="fcFlip()">Flip &#x21BA;</button>
        <button class="fc-btn" onclick="fcNav(1)">Next &#8594;</button>
      </div>
      <div class="fc-extras">
        <button class="fc-btn" style="font-size:0.88rem;padding:8px 20px;" onclick="fcShuffle()">&#x1F500; Shuffle Deck</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── TAB SWITCHING ──────────────────────────────────
function switchTab(id) {
  document.getElementById('tab-qa').classList.toggle('active', id === 'qa');
  document.getElementById('tab-fc').classList.toggle('active', id === 'fc');
  document.getElementById('panel-qa').classList.toggle('show', id === 'qa');
  document.getElementById('panel-fc').classList.toggle('show', id === 'fc');
}

// ── DATA ──────────────────────────────────────────
var topics = [
  { icon:"🗄️", title:"Data Fundamentals", qas:[
    {q:"What is the difference between Structured, Semi-Structured, and Unstructured data?",a:"<strong>Structured</strong>: Organized in rows/columns with a fixed schema (e.g., SQL tables). Easy to query.<br><strong>Semi-Structured</strong>: Has some organization but no rigid schema — tags or keys mark fields (e.g., JSON, XML, CSV).<br><strong>Unstructured</strong>: No predefined format — text, images, audio, video. Requires special processing to extract meaning."},
    {q:"What is the fundamental goal of Data Engineering?",a:"To <strong>design, build, and maintain reliable data pipelines and infrastructure</strong> that make data accessible, clean, and usable for analytics and data science. It bridges raw data sources and data consumers (analysts, ML engineers)."},
    {q:"What is the difference between quantitative and qualitative data?",a:"<strong>Quantitative</strong>: Numerical, measurable data (e.g., revenue, temperature, count). Can be discrete or continuous.<br><strong>Qualitative</strong>: Descriptive, categorical data (e.g., color, sentiment, labels). Requires encoding for most ML models."},
    {q:"Why is data cleaning important in analysis?",a:"Dirty data leads to incorrect conclusions. Cleaning handles missing values, duplicates, outliers, format inconsistencies, and incorrect types — ensuring the analysis is accurate and trustworthy."},
    {q:"What is Schema Evolution?",a:"The process of <strong>changing a data schema over time</strong> (adding/removing columns, changing types) while maintaining backward/forward compatibility. Tools like Avro, Parquet, and Delta Lake support schema evolution."}
  ]},
  { icon:"🏗️", title:"Data Architecture & Storage", qas:[
    {q:"Explain the difference between a Data Warehouse and a Data Lake.",a:"<strong>Data Warehouse</strong>: Stores structured, processed data optimized for SQL queries and reporting (e.g., Snowflake, Redshift). Schema-on-write.<br><strong>Data Lake</strong>: Stores raw data in any format at scale (e.g., S3, ADLS). Schema-on-read. Cheaper but requires more discipline to avoid a 'data swamp'."},
    {q:"Explain Star Schema vs. Snowflake Schema with pros/cons.",a:"<strong>Star Schema</strong>: Fact table surrounded by denormalized dimension tables. Pros: fast queries, simple joins. Cons: data redundancy.<br><strong>Snowflake Schema</strong>: Dimensions are normalized into sub-tables. Pros: less redundancy, easier updates. Cons: more complex joins, slower queries."},
    {q:"Explain OLTP vs. OLAP",a:"<strong>OLTP</strong>: Handles many small, fast read/write transactions (e.g., bank transfers). Row-oriented, normalized, low latency.<br><strong>OLAP</strong>: Handles complex analytical queries over large datasets. Column-oriented, denormalized, optimized for aggregations."},
    {q:"What is a Fact Table?",a:"The central table in a star/snowflake schema that contains <strong>quantitative measurements (facts)</strong> and foreign keys to dimension tables. E.g., a sales fact table has: sale_amount, quantity, date_id, product_id, customer_id."},
    {q:"What is the Small File Problem in distributed storage?",a:"When a distributed file system (like HDFS) stores too many tiny files, it overwhelms the <strong>NameNode metadata</strong>, causing high memory usage and slow operations. Solution: compact small files using Spark coalesce/repartition."},
    {q:"What is the purpose of a Staging Area?",a:"A temporary intermediate storage zone where raw data lands before transformation. Enables <strong>data validation, deduplication, auditing, and recovery</strong> if the pipeline fails mid-way."},
    {q:"What data storage solutions for big data are you familiar with?",a:"HDFS, Amazon S3, Azure Data Lake Storage, Google Cloud Storage, Delta Lake, Apache Iceberg, Apache Hudi, HBase, Cassandra, MongoDB."},
    {q:"What is HDFS and why is it important?",a:"HDFS (Hadoop Distributed File System) is a <strong>distributed, fault-tolerant file system</strong> designed for storing large files across commodity hardware. It splits files into 128MB blocks, replicates them (default 3x), and enables high-throughput access for Spark/MapReduce."},
    {q:"Explain data replication in HDFS.",a:"HDFS replicates each block across <strong>multiple DataNodes</strong> (default factor = 3). If one node fails, data remains available from another replica. The NameNode tracks block locations and triggers re-replication on failure."},
    {q:"What is denormalization and why is it used in big data?",a:"Denormalization combines related tables into wider tables to <strong>reduce expensive JOIN operations</strong>. In big data, distributed joins are costly, so trading storage space for query speed is often worthwhile."}
  ]},
  { icon:"⚡", title:"Processing Frameworks", qas:[
    {q:"Explain Batch vs. Stream processing",a:"<strong>Batch Processing</strong>: Processes large volumes of data at scheduled intervals (e.g., nightly ETL). High throughput, higher latency.<br><strong>Stream Processing</strong>: Processes data in real-time as it arrives (e.g., fraud detection). Low latency, continuous. Tools: Spark (batch/micro-batch), Flink/Kafka Streams (true streaming)."},
    {q:"What is Apache Spark and why is it preferred over Hadoop MapReduce?",a:"Spark is a <strong>fast, in-memory distributed computing engine</strong>. Preferred over MapReduce because it keeps intermediate data in RAM (vs. disk I/O), supports SQL/streaming/ML/graph in one API, and is 10-100x faster for iterative algorithms."},
    {q:"Explain the Spark architecture (Driver, Executor, Cluster Manager).",a:"<strong>Driver</strong>: Master process that runs main(), creates SparkContext, coordinates the job.<br><strong>Executor</strong>: Worker processes that execute tasks and cache data.<br><strong>Cluster Manager</strong>: Allocates resources (YARN, Kubernetes, Mesos, or Standalone)."},
    {q:"What is an RDD, and why do we use DataFrames instead?",a:"<strong>RDD</strong>: Low-level, fault-tolerant distributed collection. No schema, no optimizer.<br><strong>DataFrames</strong>: High-level API with schema, SQL-like operations, and Catalyst query optimizer — making them faster and easier to use."},
    {q:"Explain Shuffling and why you should avoid it.",a:"Shuffling is the <strong>redistribution of data across partitions</strong> triggered by groupBy, join, distinct. Expensive due to disk I/O, serialization, and network transfer. Minimize by: filtering early, using broadcast joins, and pre-partitioning data."},
    {q:"What is Data Skew and how do you fix it?",a:"Data skew occurs when some partitions have <strong>far more data than others</strong>, causing slow straggler tasks. Fixes: salting keys, broadcast joins for small tables, repartitioning, or Spark AQE (Adaptive Query Execution)."},
    {q:"How does Spark handle fault tolerance?",a:"Spark uses <strong>RDD lineage</strong> — a DAG of transformations. If a partition is lost, Spark re-computes it from the last checkpoint using the lineage graph. Checkpointing to disk breaks long lineage chains."},
    {q:"What is distributed computing, and why is it essential for big data?",a:"Distributed computing splits a large task across <strong>multiple machines</strong> working in parallel. Essential because single machines cannot store or process petabytes. Frameworks like Spark/Hadoop coordinate distributed work and handle failures automatically."}
  ]},
  { icon:"🔄", title:"ETL/ELT & Pipelines", qas:[
    {q:"What is the difference between ETL and ELT?",a:"<strong>ETL</strong>: Data is transformed before loading. Traditional approach, better for complex transforms and privacy filtering.<br><strong>ELT</strong>: Raw data is loaded first, then transformed inside the warehouse (e.g., using dbt). Modern approach leveraging cloud warehouse compute power."},
    {q:"What is data ingestion and why is it important?",a:"Data ingestion is <strong>collecting and importing data from various sources</strong> into a storage system. It's the first step in any pipeline — if ingestion is unreliable, all downstream work is compromised."},
    {q:"What is a data pipeline and its key components?",a:"A pipeline automates data flow from source to destination. Components: <strong>Source</strong> (databases, APIs, streams), <strong>Ingestion</strong>, <strong>Processing/Transformation</strong> (Spark, dbt), <strong>Storage</strong> (warehouse/lake), <strong>Orchestration</strong> (Airflow), <strong>Monitoring</strong>."},
    {q:"How do you optimize ETL processes in big data?",a:"Use columnar formats (Parquet), partition data by query patterns, push predicates down, use incremental loads instead of full refreshes, parallelize tasks, use in-memory caching, and eliminate unnecessary shuffles."},
    {q:"What is Serverless in the context of data pipelines?",a:"Serverless means running pipeline code <strong>without managing servers</strong> — the cloud auto-scales and bills per execution (e.g., AWS Lambda, Google Cloud Functions). Reduces operational overhead but has cold start latency and limited runtimes."}
  ]},
  { icon:"🌬️", title:"Apache Airflow & Orchestration", qas:[
    {q:"Explain the concept of a DAG in Apache Airflow.",a:"A <strong>DAG (Directed Acyclic Graph)</strong> represents a workflow. Nodes = Tasks, Edges = Dependencies. 'Directed' means tasks have order; 'Acyclic' means no circular dependencies. Each DAG has a schedule and defines data flow between tasks."},
    {q:"How do you handle pipeline failures in production?",a:"Set retries and retry_delay on tasks, use SLAs and alerting, implement idempotent tasks (safe to re-run), use dead-letter queues for streaming, monitor with Datadog/PagerDuty, and maintain detailed logs for root-cause analysis."},
    {q:"What are Airflow Hooks and Operators?",a:"<strong>Operators</strong>: Define a single unit of work (PythonOperator, BashOperator, PostgresOperator).<br><strong>Hooks</strong>: Interface to external systems (PostgresHook, S3Hook). Hooks manage credentials and are used inside Operators."},
    {q:"What is Backfilling in Airflow?",a:"Backfilling is <strong>re-running DAG runs for past dates</strong> to populate historical data. Useful when a new pipeline is deployed or historical data needs reprocessing. Run via CLI: airflow dags backfill -s START -e END dag_id."},
    {q:"How do you pass data between Airflow tasks?",a:"Using <strong>XComs (Cross-Communications)</strong> — key-value store in Airflow's metadata DB. Tasks push with xcom_push() and pull with xcom_pull(). For large data, write to S3/DB and pass the path as XCom to avoid bloat."}
  ]},
  { icon:"🗃️", title:"Databases & SQL", qas:[
    {q:"What is the CAP Theorem and how does it affect your choice of database?",a:"CAP: A distributed system can only guarantee <strong>2 of 3</strong>: Consistency, Availability, Partition Tolerance.<br>- CP systems (HBase, Zookeeper): consistent but may be unavailable during partitions.<br>- AP systems (Cassandra, DynamoDB): always available but eventually consistent."},
    {q:"What is a Single Point of Failure (SPOF) in a data system?",a:"A SPOF is a component whose failure brings down the entire system. Eliminated through: replication, load balancing, clustering (e.g., HA Airflow with multiple schedulers, Kafka replication, multi-AZ databases)."},
    {q:"How do you optimize a slow SQL query?",a:"Add indexes on filter/join columns, rewrite subqueries as JOINs, use EXPLAIN ANALYZE to find bottlenecks, avoid SELECT *, push filters early, use partitioned tables, consider materialized views, and keep statistics up to date."},
    {q:"Explain ACID properties in detail",a:"<strong>Atomicity</strong>: All operations succeed or all fail.<br><strong>Consistency</strong>: DB transitions between valid states only.<br><strong>Isolation</strong>: Concurrent transactions don't interfere.<br><strong>Durability</strong>: Committed transactions survive crashes (WAL, fsync)."},
    {q:"What is a Self-Join and when would you use it?",a:"A self-join joins a table <strong>to itself</strong> using aliases. Useful for hierarchical data (employees and their managers in the same table) or comparing rows within the same table."},
    {q:"What is a NoSQL database and name 4 types?",a:"Non-relational databases designed for scale and flexibility. 4 types:<br>1. <strong>Document</strong>: MongoDB<br>2. <strong>Key-Value</strong>: Redis, DynamoDB<br>3. <strong>Column-Family</strong>: Cassandra, HBase<br>4. <strong>Graph</strong>: Neo4j"},
    {q:"When would you use Cassandra instead of MySQL?",a:"Use Cassandra for: <strong>high write throughput</strong>, geographic distribution, linear horizontal scalability, time-series/IoT data. Use MySQL for: complex queries, strong ACID guarantees, relational data with joins."},
    {q:"What is a Time-Series Database (TSDB)?",a:"A database optimized for <strong>time-stamped data</strong>. Examples: InfluxDB, TimescaleDB, Prometheus. Key features: efficient retention policies, downsampling, and time-range queries."},
    {q:"What is data partitioning and why is it important?",a:"Partitioning splits large tables into <strong>smaller chunks</strong> based on a key (e.g., date, region). Benefits: faster queries via partition pruning, easier data management, better parallel processing, reduced I/O."}
  ]},
  { icon:"📨", title:"Streaming & Messaging", qas:[
    {q:"What is Apache Kafka?",a:"Kafka is a <strong>distributed event streaming platform</strong> for high-throughput, fault-tolerant, real-time data pipelines. Key concepts: Producers publish to Topics, Consumers read from them, Brokers store messages, Partitions enable parallelism."},
    {q:"What is Functional Programming and why is it used in Data Engineering?",a:"FP treats computation as evaluation of pure functions with <strong>immutable data and no side effects</strong>. Encourages idempotent transformations, easier testing, parallelism (no shared state). Spark's RDD/DataFrame API is inspired by FP."}
  ]},
  { icon:"🐍", title:"Python & Tools", qas:[
    {q:"What is pandas and when would you NOT use it?",a:"Pandas is a Python library for <strong>in-memory data manipulation</strong>. Avoid when: data exceeds available RAM (use Spark/Dask), you need distributed processing, or real-time streaming. Ideal for exploration and small-to-medium datasets (under 1GB)."},
    {q:"What is Infrastructure as Code (IaC)?",a:"IaC manages infrastructure through <strong>machine-readable config files</strong> instead of manual processes. Tools: Terraform, Pulumi, CloudFormation. Benefits: version control, reproducibility, automated provisioning, reduced human error."},
    {q:"What programming languages are best for big data analytics?",a:"<strong>Python</strong>: Most popular, rich ecosystem.<br><strong>Scala</strong>: Native Spark language, best performance.<br><strong>SQL</strong>: Universal for querying.<br><strong>Java</strong>: Hadoop ecosystem.<br><strong>R</strong>: Statistical analysis."}
  ]},
  { icon:"🔍", title:"Data Quality & Governance", qas:[
    {q:"What is Data Governance?",a:"A <strong>framework of policies, processes, and standards</strong> for managing data assets — ensuring quality, security, privacy, lineage, and compliance. Involves roles (Data Owner, Steward), cataloging, access control, and regulatory compliance (GDPR, HIPAA)."},
    {q:"What is Data Quality Profiling?",a:"Automated analysis of a dataset to understand <strong>completeness, uniqueness, consistency, validity, and accuracy</strong>. Tools: Great Expectations, Deequ, Monte Carlo. Outputs: null counts, value distributions, pattern checks, referential integrity violations."},
    {q:"What is the difference between Data Observability and Monitoring?",a:"<strong>Monitoring</strong>: Tracks predefined metrics and alerts on known failures.<br><strong>Observability</strong>: Broader capability to <strong>understand system health from outputs</strong> — detecting unknown issues through data freshness, schema changes, and distribution shifts."},
    {q:"What is a SLA in data engineering?",a:"An SLA defines the <strong>expected performance standards</strong> for data delivery — e.g., 'dashboard must be refreshed by 7am daily'. Violations trigger alerts. Airflow has built-in SLA miss callbacks."},
    {q:"How do you assess the quality of a dataset?",a:"Check: <strong>Completeness</strong> (missing values), <strong>Accuracy</strong> (correctness), <strong>Consistency</strong> (no contradictions), <strong>Timeliness</strong> (freshness), <strong>Uniqueness</strong> (no duplicates), <strong>Validity</strong> (values in expected ranges/formats)."},
    {q:"How do you ensure data governance in big data systems?",a:"Implement a data catalog, enforce role-based access control, track data lineage, apply data classification/tagging, run quality checks, establish data retention policies, audit access logs, and align with compliance requirements."}
  ]},
  { icon:"🌐", title:"Big Data Ecosystem", qas:[
    {q:"What is big data?",a:"Datasets so <strong>large, fast, or varied</strong> that traditional tools can't handle them. Defined by the V's: Volume (petabytes), Velocity (real-time), Variety (structured/unstructured), Veracity (quality), Value (business insights)."},
    {q:"What are the important V's of big data?",a:"<strong>Volume</strong>: Massive scale.<br><strong>Velocity</strong>: Speed of generation and processing.<br><strong>Variety</strong>: Different data types and formats.<br><strong>Veracity</strong>: Trustworthiness and accuracy.<br><strong>Value</strong>: Actionable insights derived from the data."},
    {q:"What are useful features and components of Hadoop?",a:"<strong>HDFS</strong>: Distributed storage.<br><strong>MapReduce</strong>: Distributed processing.<br><strong>YARN</strong>: Resource management.<br><strong>Hive</strong>: SQL on Hadoop.<br><strong>HBase</strong>: NoSQL column store.<br><strong>Zookeeper</strong>: Coordination service."},
    {q:"What are the three modes Hadoop runs?",a:"<strong>1. Standalone Mode</strong>: Single JVM, no HDFS — for development/testing.<br><strong>2. Pseudo-Distributed Mode</strong>: All daemons on one machine.<br><strong>3. Fully Distributed Mode</strong>: True cluster across multiple machines — production."},
    {q:"What are the components of the Hadoop ecosystem?",a:"HDFS, MapReduce/YARN, Hive, HBase, Pig, Sqoop, Flume, Kafka, Spark, Oozie/Airflow, Ambari/Ranger."},
    {q:"What is YARN and how does it enhance Hadoop?",a:"YARN (Yet Another Resource Negotiator) is Hadoop's <strong>cluster resource manager</strong>. It decouples resource management from processing, allowing multiple frameworks (Spark, Tez, Flink) to share the same cluster resources."},
    {q:"How are data mining and machine learning related to big data?",a:"Big data provides the <strong>fuel</strong> for ML/data mining. ML algorithms improve with more data. Big data platforms (Spark MLlib) enable training on datasets too large for single machines. Data mining discovers patterns; ML learns and predicts."},
    {q:"What is feature selection and why is it important in big data?",a:"Feature selection chooses the <strong>most relevant variables</strong> for ML models, reducing dimensionality. Reduces training time, avoids overfitting, improves interpretability, and reduces noise."},
    {q:"What are common tools for machine learning in big data?",a:"Spark MLlib, TensorFlow, PyTorch, Scikit-learn, XGBoost, H2O.ai, Databricks AutoML, Amazon SageMaker, Google Vertex AI, Azure ML, Horovod (distributed training)."},
    {q:"Explain fault tolerance in distributed systems.",a:"The ability to <strong>continue operating when components fail</strong>. Techniques: data replication, checkpointing, leader election, retry logic, circuit breakers. Spark uses lineage; Kafka uses replicated partitions; HDFS uses block replication."}
  ]},
  { icon:"📊", title:"Data Analysis & Visualization", qas:[
    {q:"What is data analysis and why is it important?",a:"The process of <strong>inspecting, cleaning, transforming, and modeling data</strong> to discover useful information and support decision-making. It transforms raw data into actionable insights for business strategy."},
    {q:"What is storytelling in data visualization?",a:"Combining <strong>data, visuals, and narrative</strong> to communicate insights compellingly. A good story contextualizes findings, highlights what matters, and makes data accessible to non-technical audiences."},
    {q:"What are hierarchical visualizations and when are they appropriate?",a:"Visualizations showing <strong>parent-child relationships</strong> — treemaps, sunburst charts, dendrograms. Appropriate for nested categories (org charts, file systems) where you want to show both hierarchy and proportional size."},
    {q:"What is the difference between bubble charts and scatter plots?",a:"<strong>Scatter plot</strong>: Shows relationship between 2 variables. Each point = one observation.<br><strong>Bubble chart</strong>: Extends scatter by adding a <strong>3rd variable as bubble size</strong>. Good for comparing 3+ dimensions simultaneously."},
    {q:"How can data visualization aid in comparing data?",a:"Bar charts, grouped bars, heatmaps, and radar charts make comparative patterns <strong>immediately visible</strong> — highlighting outliers, trends, and proportions that would be invisible in raw numbers."},
    {q:"What are the key components of effective data storytelling?",a:"<strong>1. Data</strong>: Accurate, relevant evidence.<br><strong>2. Narrative</strong>: Clear message with context.<br><strong>3. Visuals</strong>: Charts that reinforce the narrative.<br><strong>4. Audience awareness</strong>: Tailored to the viewer.<br><strong>5. Call to action</strong>: What should they do with this insight?"},
    {q:"What are common challenges in interpreting data?",a:"Correlation vs. causation confusion, selection bias, survivorship bias, misleading visualizations (truncated axes), overfitting patterns, ignoring outliers, data sparsity, and confirmation bias."}
  ]},
  { icon:"💾", title:"RAID Systems", qas:[
    {q:"What does RAID stand for?",a:"RAID = <strong>Redundant Array of Independent (or Inexpensive) Disks</strong>. A technology combining multiple disk drives into one logical unit for improved performance, redundancy, or both."},
    {q:"What is the main purpose of a RAID system?",a:"RAID provides <strong>fault tolerance (data protection against disk failure)</strong> and/or <strong>improved performance</strong> through striping and parallelism. Specific RAID levels trade off between redundancy, capacity, and speed."},
    {q:"What is the difference between hardware RAID and software RAID?",a:"<strong>Hardware RAID</strong>: Dedicated controller handles RAID operations independently of CPU — faster, more reliable, has onboard cache.<br><strong>Software RAID</strong>: OS manages RAID (e.g., Linux mdadm) — cheaper, flexible, but uses CPU resources."},
    {q:"Which RAID level offers no redundancy?",a:"<strong>RAID 0</strong> (striping) — data is split across disks for maximum performance and capacity, but zero fault tolerance. If any one disk fails, ALL data is lost."},
    {q:"Minimum disks required for RAID 1, 5, and 10?",a:"<strong>RAID 1</strong>: 2 disks (mirroring).<br><strong>RAID 5</strong>: 3 disks (striping with distributed parity).<br><strong>RAID 10</strong>: 4 disks (striped mirrors = RAID 0 + RAID 1 combined)."},
    {q:"What is the main advantage of RAID 6 over RAID 5?",a:"RAID 6 uses <strong>double distributed parity</strong>, allowing it to survive <strong>2 simultaneous disk failures</strong> vs. RAID 5's 1. Critical for large arrays where rebuild time exposes risk of a second failure."},
    {q:"Why is RAID 10 considered better than RAID 01?",a:"<strong>RAID 10</strong>: If a disk fails, only its mirror set is affected. <strong>RAID 01</strong>: If one disk fails, the entire stripe is lost. RAID 10 is more resilient during rebuilds."},
    {q:"Which RAID level is most cost-effective for high-capacity safe storage?",a:"<strong>RAID 5</strong> — good balance of capacity (1 disk overhead), performance, and fault tolerance. For very large arrays, <strong>RAID 6</strong> is preferred for double-failure protection."},
    {q:"What is the Write Hole problem in RAID 5?",a:"A <strong>data consistency vulnerability</strong> where a power failure mid-write (data written but parity not yet updated) causes parity to become inconsistent. Mitigated by: NVRAM cache, journaling, or ZFS (atomic writes)."}
  ]},
  { icon:"🏛️", title:"Modern Data Architecture", qas:[
    {q:"What is a Data Mesh?",a:"An <strong>organizational and technical approach</strong> to decentralize data ownership. Key principles: Domain-oriented ownership, Data as a product, Self-serve data infrastructure, Federated computational governance."},
    {q:"Explain Vertical vs. Horizontal Scaling.",a:"<strong>Vertical Scaling</strong> (Scale Up): Add more CPU/RAM/disk to a single machine. Has hardware limits, expensive, single point of failure.<br><strong>Horizontal Scaling</strong> (Scale Out): Add more machines. More resilient, theoretically unlimited, but more complex coordination."},
    {q:"What is the lifecycle of a data science project?",a:"<strong>1.</strong> Problem Definition → <strong>2.</strong> Data Collection → <strong>3.</strong> Data Cleaning → <strong>4.</strong> Exploratory Data Analysis → <strong>5.</strong> Feature Engineering → <strong>6.</strong> Model Building → <strong>7.</strong> Evaluation → <strong>8.</strong> Deployment → <strong>9.</strong> Monitoring"}
  ]}
];

// ── BUILD Q&A ──────────────────────────────────────
function buildQA() {
  var html = '';
  var qNum = 1;
  topics.forEach(function(t, ti) {
    html += '<div class="topic" id="tp'+ti+'">';
    html += '<div class="topic-hd" onclick="toggleTopic('+ti+')">';
    html += t.icon + ' ' + t.title;
    html += ' <span style="font-size:0.78rem;opacity:0.65;font-family:Nunito,sans-serif;font-weight:600;">('+t.qas.length+')</span>';
    html += '<span class="arrow">&#x25BC;</span></div>';
    html += '<div class="topic-body">';
    t.qas.forEach(function(qa, qi) {
      html += '<div class="qa" id="qa'+ti+'_'+qi+'">';
      html += '<div class="qa-q" onclick="toggleQA('+ti+','+qi+')">';
      html += '<span class="num">'+qNum+'.</span>';
      html += '<span style="flex:1">'+qa.q+'</span>';
      html += '<span class="arr">&#x25BE;</span></div>';
      html += '<div class="qa-ans"><div class="qa-ans-in">'+qa.a+'</div></div></div>';
      qNum++;
    });
    html += '</div></div>';
  });
  document.getElementById('panel-qa').innerHTML = html;
}

function toggleTopic(ti) {
  document.getElementById('tp'+ti).classList.toggle('closed');
}
function toggleQA(ti, qi) {
  document.getElementById('qa'+ti+'_'+qi).classList.toggle('open');
}

// ── FLASHCARDS ────────────────────────────────────
var allCards = [];
topics.forEach(function(t) {
  t.qas.forEach(function(qa) {
    allCards.push({q:qa.q, a:qa.a, topic:t.title, icon:t.icon});
  });
});

var fcIdx = 0;
var fcFlipped = false;
var fcOrder = allCards.map(function(_,i){return i;});
var touchX0 = 0;
var touchY0 = 0;
var isAnimating = false;

function fcLoad() {
  var c = allCards[fcOrder[fcIdx]];
  document.getElementById('fc-q').innerHTML = c.q;
  document.getElementById('fc-a').innerHTML = c.a;
  document.getElementById('fc-counter').textContent = 'Card '+(fcIdx+1)+' of '+allCards.length;
  document.getElementById('fc-topic').textContent = c.icon+' '+c.topic;
  document.getElementById('fc-prog').style.width = Math.round((fcIdx+1)/allCards.length*100)+'%';
}

function fcReset() {
  fcFlipped = false;
  document.getElementById('fc-inner').classList.remove('flipped');
}

function fcFlip() {
  fcFlipped = !fcFlipped;
  document.getElementById('fc-inner').classList.toggle('flipped', fcFlipped);
}

function fcNav(dir) {
  if(isAnimating) return;
  isAnimating = true;
  var stage = document.getElementById('fc-stage');
  var animOut = dir > 0 ? 'anim-next' : 'anim-prev';
  var animIn  = dir > 0 ? 'anim-in-next' : 'anim-in-prev';

  stage.classList.add(animOut);
  setTimeout(function() {
    stage.classList.remove(animOut);
    fcIdx = (fcIdx + dir + allCards.length) % allCards.length;
    fcReset();
    fcLoad();
    stage.classList.add(animIn);
    setTimeout(function() {
      stage.classList.remove(animIn);
      isAnimating = false;
    }, 240);
  }, 190);
}

function fcShuffle() {
  for(var i=fcOrder.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=fcOrder[i]; fcOrder[i]=fcOrder[j]; fcOrder[j]=tmp;
  }
  fcIdx = 0;
  fcReset();
  fcLoad();
}

// Touch handlers on the stage element itself
var stageEl = document.getElementById('fc-stage');
stageEl.addEventListener('touchstart', function(e) {
  touchX0 = e.touches[0].clientX;
  touchY0 = e.touches[0].clientY;
}, {passive:true});

stageEl.addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - touchX0;
  var dy = e.changedTouches[0].clientY - touchY0;
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    fcNav(dx < 0 ? 1 : -1);
  } else if(Math.abs(dx) < 15 && Math.abs(dy) < 15) {
    fcFlip();
  }
}, {passive:true});

// Click to flip (desktop)
stageEl.addEventListener('click', function() {
  if(!isAnimating) fcFlip();
});

// Keyboard
document.addEventListener('keydown', function(e) {
  if(!document.getElementById('panel-fc').classList.contains('show')) return;
  if(e.key === 'ArrowRight') fcNav(1);
  else if(e.key === 'ArrowLeft') fcNav(-1);
  else if(e.key === ' ') { e.preventDefault(); fcFlip(); }
});

// ── INIT ──────────────────────────────────────────
buildQA();
fcLoad();
</script>
<script>
(function(){
  var cv = document.getElementById('bamboo-canvas');
  function resize(){ cv.width = window.innerWidth; cv.height = window.innerHeight; draw(); }
  window.addEventListener('resize', resize);

  function drawLeaf(ctx, x, y, dir, w){
    ctx.save();
    ctx.translate(x + dir*(w/2), y);
    ctx.rotate(dir * 0.5);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(dir*30,-15, dir*60,-10, dir*75,5);
    ctx.bezierCurveTo(dir*60,15, dir*30,20, 0,0);
    var lg = ctx.createLinearGradient(0,0,dir*75,5);
    lg.addColorStop(0, 'rgba(60,140,50,0.55)');
    lg.addColorStop(1, 'rgba(100,190,70,0.3)');
    ctx.fillStyle = lg;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(dir*25,-5, dir*50,0, dir*75,5);
    ctx.strokeStyle = 'rgba(150,230,100,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  function draw(){
    var ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);

    var stalks = [
      {x:0.05,w:28,segs:9},{x:0.13,w:18,segs:7},{x:0.22,w:32,segs:10},
      {x:0.35,w:14,segs:6},{x:0.44,w:24,segs:8},{x:0.58,w:16,segs:7},
      {x:0.67,w:30,segs:9},{x:0.78,w:20,segs:8},{x:0.88,w:26,segs:10},{x:0.95,w:14,segs:6}
    ];

    stalks.forEach(function(s){
      var x = s.x * W;
      var segH = H / s.segs;
      var g = ctx.createLinearGradient(x-s.w/2,0,x+s.w/2,0);
      g.addColorStop(0,   'rgba(30,80,35,0.55)');
      g.addColorStop(0.3, 'rgba(80,160,70,0.65)');
      g.addColorStop(0.7, 'rgba(60,130,55,0.6)');
      g.addColorStop(1,   'rgba(25,65,30,0.5)');

      for(var i=0; i<s.segs; i++){
        var y0 = i * segH;
        var y1 = y0 + segH;
        ctx.beginPath();
        ctx.roundRect(x-s.w/2, y0+2, s.w, segH-4, 4);
        ctx.fillStyle = g;
        ctx.fill();

        var ng = ctx.createLinearGradient(x-s.w/2,y1,x+s.w/2,y1);
        ng.addColorStop(0,   'rgba(20,60,25,0.7)');
        ng.addColorStop(0.5, 'rgba(100,180,80,0.8)');
        ng.addColorStop(1,   'rgba(20,60,25,0.7)');
        ctx.fillStyle = ng;
        ctx.fillRect(x-s.w/2-2, y1-5, s.w+4, 8);

        ctx.beginPath();
        ctx.roundRect(x-s.w/2+3, y0+6, s.w*0.18, segH-14, 2);
        ctx.fillStyle = 'rgba(180,255,150,0.12)';
        ctx.fill();
      }

      [2,4,6].forEach(function(ni){
        if(ni >= s.segs) return;
        drawLeaf(ctx, x, ni*segH, ni%2===0?1:-1, s.w);
      });
    });

    var vig = ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.85);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,15,5,0.5)');
    ctx.fillStyle = vig;
    ctx.fillRect(0,0,W,H);
  }

  resize();
})();
</script>
